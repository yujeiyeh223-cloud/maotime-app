<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>套量服 連線診斷</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:16px calc(env(safe-area-inset-left,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 24px);
  background:#151515;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;line-height:1.5}
h1{font-size:19px;margin:8px 0 4px}
h2{font-size:15px;margin:20px 0 8px;color:#e0b35c}
.sub{font-size:13px;color:#999;margin-bottom:14px}
.env{background:#1f1f1f;border-radius:10px;padding:10px 12px;font-size:12px;color:#aaa;margin-bottom:14px;word-break:break-all;white-space:pre-wrap}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#c1512a;color:#fff;
  font-family:inherit;font-size:16px;font-weight:700;margin-bottom:14px}
button:disabled{opacity:.5}
button.alt{background:#3a3a3a}
.warn{background:#2a2118;border:1px solid #5a4630;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;margin-bottom:12px}
.hist{background:#1a1a1a;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#bbb;margin-bottom:10px}
.hist b{color:#eee}
.row{background:#1f1f1f;border-radius:10px;padding:11px 12px;margin-bottom:9px;font-size:13px}
.row .n{font-weight:700;font-size:14px;margin-bottom:3px}
.row .d{color:#bbb;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.ok{border-left:4px solid #2f7a4f}
.bad{border-left:4px solid #c43d3d}
.run{border-left:4px solid #c98a2c}
.verdict{background:#23201a;border:1px solid #4a4030;border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px;line-height:1.7}
.big{font-size:15px;font-weight:700}
.g{color:#5fbf85}.r{color:#ef7676}.y{color:#e0b35c}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:3px 9px;border-radius:999px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.chip.g{background:#1d3b2a;color:#7fd3a0}
.chip.r{background:#3d1f1f;color:#ef8a8a}
</style>
</head>
<body>
<h1>套量服 連線診斷</h1>
<div class="sub">只做讀取，不寫入任何資料。</div>

<div class="warn">
  <b>⚠️ 冷啟動測試要先跑，而且要挑「一段時間沒人用」的時候</b><br>
  例如早上第一件事。只要先跑過下面的「完整測試」，伺服器就被弄暖了，冷啟動就量不到了。
</div>
<button id="cold" onclick="runCold()">① 冷啟動測試（只打一發，最多等 60 秒）</button>
<div id="coldout"></div>
<div id="hist"></div>

<hr style="border:none;border-top:1px solid #333;margin:22px 0 16px">
<button id="go" class="alt" onclick="runAll()">② 完整測試（重試策略 + 連打統計，1～2 分鐘）</button>
<div class="sub" style="margin-top:-6px">這個會把伺服器弄暖，所以一定要在①之後才跑。</div>
<div class="env" id="env">…</div>
<div id="out"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxFjRU0iMA-XmUFUxp2q8-W1-iQd6XF6HpMCeENCbGRnzO_6w2nPpsctWNWxH1k0Y7y3w/exec';
const INV = GAS_URL + '?action=getInventory&data=%7B%7D';   // 與 App 送出的網址完全一致
const TRY_MS   = 8000;   // 提案:每一發只等 8 秒(現在的 App 是等 20 秒)
const MAX_TRY  = 3;      // 提案:最多重打 3 次
const SAMPLES  = 8;      // 統計用:連打幾次

document.getElementById('env').textContent =
  '頁面來源：' + location.origin +
  '\n連線狀態：' + (navigator.onLine ? '線上' : '離線') +
  '\nService Worker：' + (navigator.serviceWorker && navigator.serviceWorker.controller ? '有接管這一頁' : '沒有接管') +
  '\n測試網址：與 App 送出的完全一致（含 &data=%7B%7D）';

const out = document.getElementById('out');
setTimeout(renderHist, 0);   // 函式定義在下面,等這一輪 script 跑完再畫
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; out.appendChild(e); return e; }
function addRow(name){ const e=el('div','row run','<div class="n">'+name+'</div><div class="d">測試中…</div>'); return e; }
function done(e, good, lines){ e.className='row '+(good?'ok':'bad'); e.querySelector('.d').innerHTML=lines.join('<br>'); }

/** 打一發。回傳 ok / 耗時 / 是不是「卡住」(逾時)。用 App 一模一樣的 fetch 選項。 */
async function once(url, limitMs){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), limitMs);
  const t0 = performance.now();
  try{
    const r = await fetch(url, {cache:'no-store', signal: ctl.signal});
    const text = await r.text();
    clearTimeout(timer);
    let items = null;
    try{ items = (JSON.parse(text).items||[]).length; }catch(e){}
    return {ok:r.ok, ms:Math.round(performance.now()-t0), status:r.status, items:items};
  }catch(e){
    clearTimeout(timer);
    return {ok:false, ms:Math.round(performance.now()-t0),
            timeout:(e.name==='AbortError'), err:e.name+'：'+(e.message||'(沒有訊息)')};
  }
}

/** 提案中的修法:每發 8 秒上限,卡住就重打,最多三次。讀取是唯讀的,重打安全。 */
async function withRetry(){
  const log = [];
  const t0 = performance.now();
  for(let i=1; i<=MAX_TRY; i++){
    const r = await once(INV, TRY_MS);
    log.push(r);
    if(r.ok) return {ok:true, log, total:Math.round(performance.now()-t0)};
  }
  return {ok:false, log, total:Math.round(performance.now()-t0)};
}

function describe(r){
  if(r.ok) return '<span class="g">成功</span> ' + r.ms + ' ms（' + r.items + ' 筆）';
  if(r.timeout) return '<span class="r">卡住</span> ' + r.ms + ' ms（等滿 ' + (TRY_MS/1000) + ' 秒）';
  return '<span class="r">失敗</span> ' + r.ms + ' ms　' + r.err;
}

// ---------- 冷啟動測試 ----------
// **不切掉、等到底**(最多 60 秒)。前一輪證明了「8 秒切掉再重打」是最糟的做法:
// 切掉不會讓 GAS 停下來,重打只是再疊一個上去,冷啟動反而更久。
// 想量的是「第一個使用者到底要等多久」,所以只打一發、耐心等完。
// 網址可加 ?cold=8000 縮短上限(開發時驗證用)。
const COLD_MS = Math.max(1000, Number(new URLSearchParams(location.search).get('cold')) || 60000);
const HIST_KEY = 'maotime-diag-cold';

function loadHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)) || []; }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(-12))); }catch(e){} }

function renderHist(){
  const h = loadHist();
  const box = document.getElementById('hist');
  if(!h.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="hist"><b>歷次冷啟動紀錄</b>（存在這支手機裡）<br>' +
    h.slice().reverse().map(x =>
      new Date(x.at).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) +
      '　' + (x.ok ? '<b>' + (x.ms/1000).toFixed(1) + ' 秒</b>' + (x.items!=null ? '（' + x.items + ' 筆）' : '')
                   : '<span class="r">等滿 ' + (x.ms/1000).toFixed(0) + ' 秒還沒回來</span>')
    ).join('<br>') + '</div>';
}

async function runCold(){
  const btn = document.getElementById('cold');
  btn.disabled = true; btn.textContent = '等待中…（最多 ' + (COLD_MS/1000) + ' 秒，請不要切走）';
  const box = document.getElementById('coldout');
  box.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'row run';
  row.innerHTML = '<div class="n">冷啟動：打一發，等到底</div><div class="d">計時中…</div>';
  box.appendChild(row);

  const t0 = performance.now();
  const tick = setInterval(()=>{
    row.querySelector('.d').textContent = '已經等了 ' + ((performance.now()-t0)/1000).toFixed(0) + ' 秒…';
  }, 1000);

  const r = await once(INV, COLD_MS);
  clearInterval(tick);

  const h = loadHist();
  h.push({at: Date.now(), ms: r.ms, ok: r.ok, items: r.items});
  saveHist(h); renderHist();

  if(r.ok){
    done(row, true, [
      '<span class="big g">' + (r.ms/1000).toFixed(1) + ' 秒</span>　拿到 ' + r.items + ' 筆',
      r.ms > 20000 ? '→ <b>超過 App 現在的 20 秒上限</b>，這種時候同事就是看到一片空白'
                   : (r.ms > 6000 ? '→ 比暖機後（2～5 秒）慢一截，但 App 的 20 秒還撐得住'
                                  : '→ 這一發並不冷。伺服器可能剛被用過，換個時間再測一次'),
    ]);
  }else{
    done(row, false, [
      '<span class="big r">等滿 ' + (COLD_MS/1000) + ' 秒還沒回來</span>',
      r.timeout ? '→ 冷啟動比 ' + (COLD_MS/1000) + ' 秒還久，或是卡死了' : r.err,
    ]);
  }
  btn.disabled = false; btn.textContent = '① 冷啟動測試（再測一次）';
}

async function runAll(){
  out.innerHTML = '';
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = '測試中…（請不要切走）';

  // ---------- A:重試策略跑三輪 ----------
  el('h2', null, 'A. 提案的修法：每發等 ' + (TRY_MS/1000) + ' 秒，卡住就重打（最多 ' + MAX_TRY + ' 次）');
  const aResults = [];
  for(let round=1; round<=3; round++){
    const row = addRow('第 ' + round + ' 輪');
    const res = await withRetry();
    aResults.push(res);
    const lines = res.log.map((r,i)=>'　第 '+(i+1)+' 發：'+describe(r));
    lines.unshift('<span class="big ' + (res.ok?'g':'r') + '">' +
      (res.ok ? '拿到資料（共 ' + res.total + ' ms，打了 ' + res.log.length + ' 發）' : '三發都沒拿到') + '</span>');
    done(row, res.ok, lines);
  }

  // ---------- B:連打統計,量卡住的頻率 ----------
  el('h2', null, 'B. 連打 ' + SAMPLES + ' 次（每次 ' + (TRY_MS/1000) + ' 秒上限），看多常卡住');
  const row = addRow('進行中…');
  const samples = [];
  const chipsWrap = document.createElement('div'); chipsWrap.className='chips';
  row.appendChild(chipsWrap);
  for(let i=0; i<SAMPLES; i++){
    const r = await once(INV, TRY_MS);
    samples.push(r);
    const c = document.createElement('span');
    c.className = 'chip ' + (r.ok?'g':'r');
    c.textContent = (i+1) + '：' + (r.ok ? r.ms+'ms' : (r.timeout?'卡住':'失敗'));
    chipsWrap.appendChild(c);
    row.querySelector('.d').textContent = '已打 ' + (i+1) + ' / ' + SAMPLES + '…';
  }
  const bad = samples.filter(s=>!s.ok).length;
  const good = samples.filter(s=>s.ok);
  const avg = good.length ? Math.round(good.reduce((a,b)=>a+b.ms,0)/good.length) : 0;
  row.className = 'row ' + (bad? 'bad':'ok');
  row.querySelector('.n').textContent = '結果';
  row.querySelector('.d').innerHTML =
    '<span class="big ' + (bad?'r':'g') + '">' + SAMPLES + ' 次裡卡住 ' + bad + ' 次</span>' +
    '<br>' + (good.length ? '成功那幾次平均 <b>' + avg + ' ms</b>' : '沒有任何一次成功');

  // ---------- 結論 ----------
  const aOk = aResults.filter(r=>r.ok).length;
  const needed = aResults.filter(r=>r.ok && r.log.length>1).length;
  const v = document.createElement('div'); v.className='verdict';
  v.innerHTML =
    '<b>這一輪的結論</b><br>' +
    '· 重試策略：三輪裡 <b>' + aOk + ' 輪</b>拿到資料' + (needed? '（其中 ' + needed + ' 輪是靠重打才救回來的）' : '') + '<br>' +
    '· 卡住頻率：<b>' + bad + ' / ' + SAMPLES + '</b><br>' +
    '· 正常時的速度：' + (good.length ? '約 <b>' + avg + ' ms</b>' : '<b>沒有成功的樣本</b>') + '<br><br>' +
    (bad === 0
      ? '這一輪完全沒卡住。請等一下再按「再測一次」，多測幾輪才看得出頻率。'
      : (aOk === 3
        ? '有卡住，但重試策略每一輪都救回來了 → 這個修法有效。'
        : '重試三次仍有拿不到的情況，重試次數或許要再加，或是有別的原因。'));
  out.insertBefore(v, out.firstChild);

  btn.disabled = false; btn.textContent = '再測一次';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
